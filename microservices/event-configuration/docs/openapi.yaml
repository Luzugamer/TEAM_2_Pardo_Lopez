            application/problem+json:
              schema: { $ref: "#/components/schemas/ScheduleConflictProblem" }
        "412": { $ref: "#/components/responses/ProblemPreconditionFailed" }
        "422": { $ref: "#/components/responses/ProblemUnprocessable" }

  /events/{id}/sessions/{session_id}/cancellations:
    post:
      x-implementation-status: planned
      tags: [Schedule - EC-B]
      summary: Cancel a scheduled session
      description: Proposed command route because the canonical API catalog specifies the lifecycle result but not the session-command path.
      operationId: ecBApi018CancelSession
      x-requirement-id: EC-B-API-018
      x-proposed-route: true
      x-required-scope: events:write
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Session cancelled; reservations released and revision recorded.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/ProblemUnauthorized" }
        "403": { $ref: "#/components/responses/ProblemForbidden" }
        "404": { $ref: "#/components/responses/ProblemNotFound" }
        "409": { $ref: "#/components/responses/ProblemConflict" }
        "412": { $ref: "#/components/responses/ProblemPreconditionFailed" }
        "422": { $ref: "#/components/responses/ProblemUnprocessable" }

  /events/{id}/sessions/{session_id}/schedules:
    post:
      tags: [Schedule - EC-B]
      summary: Schedule a draft session
      description: >-
        Performs the draft-to-scheduled transition. Validates the event window and all exclusive
        resources, then persists reservations atomically with the session revision.
      operationId: ecBApi023ScheduleSession
      x-requirement-id: EC-B-API-023
      x-required-scope: events:write
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_event_revision]
              properties:
                expected_event_revision:
                  type: integer
                  minimum: 1
                  description: Event revision returned by the Configuration event API; scheduling fails if the event snapshot has changed.
      responses:
        "200":
          description: Session scheduled; exclusive resource reservations are committed.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/ProblemUnauthorized" }
        "403": { $ref: "#/components/responses/ProblemForbidden" }
        "404": { $ref: "#/components/responses/ProblemNotFound" }
        "409":
          description: Invalid session state or exclusive-resource conflict prevents scheduling.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ScheduleConflictProblem"
                  - $ref: "#/components/schemas/ProblemDetails"
        "412": { $ref: "#/components/responses/ProblemPreconditionFailed" }
        "422":
          description: Session time falls outside the event window or references are invalid; the draft remains unchanged.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /events/{id}/sessions/{session_id}/completions:
    post:
      x-implementation-status: planned
      tags: [Schedule - EC-B]
      summary: Mark a scheduled session as completed
      description: Proposed command route because the canonical API catalog specifies the lifecycle result but not the session-command path.
      operationId: ecBApi019CompleteSession
      x-requirement-id: EC-B-API-019
      x-proposed-route: true
      x-required-scope: events:write
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Session completed and revision recorded.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/ProblemUnauthorized" }
        "403": { $ref: "#/components/responses/ProblemForbidden" }
        "404": { $ref: "#/components/responses/ProblemNotFound" }
        "409": { $ref: "#/components/responses/ProblemConflict" }
        "412": { $ref: "#/components/responses/ProblemPreconditionFailed" }
        "422": { $ref: "#/components/responses/ProblemUnprocessable" }

  /events/{id}/schedule-validations:
    post:
      tags: [Schedule - EC-B]
      summary: Validate a batch of candidate sessions against the persisted agenda without persisting it
      description: candidate_sessions is an additive batch of proposed sessions; already scheduled sessions remain in place and are checked as occupied resources.
      operationId: ecBApi017ValidateSchedule
      x-requirement-id: EC-B-API-017
      x-required-scope: events:write
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleValidationRequest" }
      responses:
        "200":
          description: Blocking conflicts and non-blocking warnings for the proposed schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleValidationResponse" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/ProblemUnauthorized" }
        "403": { $ref: "#/components/responses/ProblemForbidden" }
        "404": { $ref: "#/components/responses/ProblemNotFound" }
        "422": { $ref: "#/components/responses/ProblemUnprocessable" }

components:
  securitySchemes:
    DevActor:
      type: apiKey
      in: header
      name: x-dev-actor
      description: Local development actor fixture. Never use outside the development profile.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified token with the Configuration API audience. DevActor is accepted only by the local development profile.

  schemas:
    FormsDraftInput:
      type: object
      additionalProperties: false
      required: [schema, ui_schema, consent, field_policies]
      properties:
        schema: { type: object, description: JSON Schema 2020-12 con subconjunto permitido. }
        ui_schema: { type: object, description: UI declarativa; no se permite código. }
        consent: { type: object, required: [text, version], properties: { text: { type: string }, version: { type: string } } }
        field_policies: { type: object, description: Políticas por campo; requiere purpose, classification, retention y export_allowlist. }
    EventCreate:
      type: object
      required:
        - site_id
        - slug
        - kind
        - title
        - timezone
        - starts_at
        - ends_at
      properties:
        site_id:
          type: string
          format: uuid
          example: "0194eb45-d881-7f93-9c5f-3c81eef671d1"
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 120
          example: "cloud-summit-2026"
        kind:
          type: string
          example: "conference"
        title:
          type: string
          maxLength: 255
          example: "Cloud Summit 2026"
        description:
          type: [string, "null"]
          example: "Conferencia anual sobre arquitecturas distribuidas y cloud computing."
        timezone:
          type: string
          example: "America/Lima"
        starts_at:
          type: string
          format: date-time
          example: "2026-11-20T14:00:00Z"
        ends_at:
          type: string
          format: date-time
          example: "2026-11-22T23:00:00Z"
        policy:
          type: object
          default: {}
          example:
            registration:
              requires_approval: false
              capacity_limit_type: "unlimited"
        metadata:
          type: object
          default: {}

    EventUpdate:
      type: object
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 120
          example: "cloud-summit-2026-updated"
        kind:
          type: string
          example: "conference"
        title:
          type: string
          maxLength: 255
          example: "Cloud Summit 2026 (Updated)"
        description:
          type: [string, "null"]
        timezone:
          type: string
          example: "America/Lima"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        policy:
          type: object
        metadata:
          type: object
        change_summary:
          type: string
          maxLength: 500
          example: "Actualización de títulos y políticas de registro."

    EventDuplicate:
      type: object
      required:
        - slug
        - site_id
        - starts_at
        - ends_at
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 120
          example: "cloud-summit-2027"
        starts_at:
          type: string
          format: date-time
          example: "2027-11-20T14:00:00Z"
        ends_at:
          type: string
          format: date-time
          example: "2027-11-22T23:00:00Z"
        site_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
          example: "Cloud Summit 2027"
        description:
          type: [string, "null"]
        metadata:
          type: object

    EventResponse:
      type: object
      required:
        - id
        - organization_id
        - site_id
        - slug
        - kind
        - title
        - timezone
        - starts_at
        - ends_at
        - status
        - revision_number
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        slug:
          type: string
        kind:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
        timezone:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, published, closed, cancelled, archived]
        current_revision_id:
          type: [string, "null"]
          format: uuid
        revision_number:
          type: integer
          example: 1
        policy:
          type: object
        metadata:
          type: object
        cancellation_reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventListResponse:
      type: object
      required:
        - items
        - page_info
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventResponse"
        page_info:
          type: object
          required:
            - has_next_page
            - next_cursor
          properties:
            has_next_page:
              type: boolean
            next_cursor:
              type: [string, "null"]

    AssignmentCreate:
      type: object
      required:
        - user_id
        - role
        - scopes
      properties:
        user_id:
          type: string
          format: uuid
          example: "0194eb00-0000-7000-9000-000000000002"
        role:
          type: string
          maxLength: 50
          example: "speaker-coordinator"
        scopes:
          type: array
          items:
            type: string
          example: ["events:write"]
        valid_from:
          type: string
          format: date-time
          example: "2026-11-20T00:00:00Z"
        valid_to:
          type: string
          format: date-time
          example: "2026-11-23T00:00:00Z"
        site_id:
          type: string
          format: uuid

    AssignmentResponse:
      type: object
      required:
        - id
        - organization_id
        - event_id
        - user_id
        - role
        - scopes
        - valid_from
        - is_active
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        event_id:
          type: [string, "null"]
          format: uuid
        site_id:
          type: [string, "null"]
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
        scopes:
          type: array
          items:
            type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: [string, "null"]
          format: date-time
        is_active:
          type: boolean
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReadinessReport:
      type: object
      required:
        - is_ready
        - event_id
        - organization_id
        - expected_revision
        - errors
        - warnings
        - checked_at
      properties:
        is_ready:
          type: boolean
        event_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        expected_revision:
          type: integer
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        checked_at:
          type: string
          format: date-time

    PublicationValidationCreate:
      type: object
      required:
        - expected_event_revision
      properties:
        expected_event_revision:
          type: integer
          minimum: 1

    ReleaseCreate:
      type: object
      required:
        - expected_event_revision
      properties:
        expected_event_revision:
          type: integer
          minimum: 1
        effective_at:
          type: string
          format: date-time
          example: "2026-11-20T14:00:00Z"

    ReleaseResponse:
      type: object
      required:
        - id
        - organization_id
        - event_id
        - release_version
        - effective_at
        - manifest_ref
        - manifest_hash
        - manifest
        - event_revision_number
        - status
        - created_by
        - created_at
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        release_version:
          type: integer
          minimum: 1
        effective_at:
          type: string
          format: date-time
        manifest_ref:
          type: string
        manifest_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        manifest:
          type: object
        event_revision_number:
          type: integer
        status:
          type: string
          enum: [published, superseded, cancelled]
        created_by:
          type: string
        created_at:
          type: string
          format: date-time

    AuditRecord:
      type: object
      required:
        - id
        - organization_id
        - entity_type
        - entity_id
        - action
        - actor_id
        - actor_roles
        - created_at
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        action:
          type: string
        actor_id:
          type: string
        actor_roles:
          type: array
          items:
            type: string
        request_id:
          type: [string, "null"]
        idempotency_key:
          type: [string, "null"]
        revision_number:
          type: [integer, "null"]
        diff:
          type: [object, "null"]
        payload_hash:
          type: [string, "null"]
          pattern: "^[a-f0-9]{64}$"
        client_ip:
          type: [string, "null"]
        user_agent:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time

    EventHistoryResponse:
      type: object
      required:
        - event_id
        - organization_id
        - current_revision
        - revisions
        - audit_trail
      properties:
        event_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        current_revision:
          type: integer
        revisions:
          type: array
          items:
            type: object
        audit_trail:
          type: array
          items:
            $ref: "#/components/schemas/AuditRecord"

    VenueWrite:
      type: object
      additionalProperties: false
      required: [kind, name, location, exclusive]
      allOf:
        - if:
            properties:
              kind: { const: room }
            required: [kind]
          then:
            required: [parent_venue_id]
            properties:
              parent_venue_id:
                type: string
                format: uuid
      properties:
        kind:
          type: string
          enum: [venue, room]
          description: A reservable place or a room belonging to a parent venue.
        parent_venue_id:
          type: string
          format: uuid
          description: Required for kind=room; must reference a venue in this organization.
        name:
          type: string
          minLength: 1
          maxLength: 180
        location:
          $ref: "#/components/schemas/VenueLocation"
        capacity:
          type: integer
          minimum: 1
          description: Optional maximum attendee capacity.
        exclusive:
          type: boolean
        accessibility:
          type: array
          description: Accessibility features supported by the venue.
          items:
            type: string
            maxLength: 80

    VenuePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        kind: { type: string, enum: [venue, room] }
        parent_venue_id: { type: [string, "null"], format: uuid }
        name: { type: string, minLength: 1, maxLength: 180 }
        location: { $ref: "#/components/schemas/VenueLocation" }
        capacity: { type: integer, minimum: 1 }
        exclusive: { type: boolean }
        accessibility:
          type: array
          items: { type: string, maxLength: 80 }

    VenueResponse:
      type: object
      required: [id, organization_id, kind, parent_venue_id, name, location, capacity, exclusive, accessibility, archived_at, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        kind: { type: string, enum: [venue, room] }
        parent_venue_id: { type: [string, "null"], format: uuid }
        name: { type: string }
        location: { $ref: "#/components/schemas/VenueLocation" }
        capacity: { type: [integer, "null"], minimum: 1 }
        exclusive: { type: boolean }
        accessibility:
          type: array
          items: { type: string }
        archived_at: { type: [string, "null"], format: date-time }
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VenueListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/VenueResponse" }
        next_cursor:
          type: [string, "null"]

    VenueLocation:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address: { type: string, minLength: 1, maxLength: 240 }
        locality: { type: string, maxLength: 120 }
        region: { type: string, maxLength: 120 }
        country_code:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 code.
        postal_code: { type: string, maxLength: 24 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }

    SpeakerWrite:
      type: object
      additionalProperties: false
      required: [display_name, public_consent]
      allOf:
        - if:
            properties:
              public_consent: { const: true }
            required: [public_consent]
          then:
            required: [public_consent_version]
            properties:
              public_consent_version:
                type: string
                minLength: 1
                maxLength: 80
      properties:
        display_name: { type: string, minLength: 1, maxLength: 180 }
        bio: { type: string, maxLength: 5000 }
        media_ref:
          type: string
          maxLength: 500
          description: Reference to media managed by the media owner; no binary content is accepted here.
        public_consent:
          type: boolean
          description: False keeps the profile out of public artifacts; true accepts the active notice and requires its server-issued version.
        public_consent_version:
          type: string
          minLength: 1
          maxLength: 80
          description: Required only with public_consent=true; the service rejects this field when revoking consent or when the version is stale or unknown.
        exclusive: { type: boolean, default: false }

    SpeakerPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      allOf:
        - if:
            properties:
              public_consent: { const: true }
            required: [public_consent]
          then:
            required: [public_consent_version]
            properties:
              public_consent_version:
                type: string
                minLength: 1
                maxLength: 80
      properties:
        display_name: { type: string, minLength: 1, maxLength: 180 }
        bio: { type: string, maxLength: 5000 }
        media_ref: { type: string, maxLength: 500 }
        public_consent:
          type: boolean
          description: Set false to revoke consent. Setting true requires the active public_consent_version.
        public_consent_version: { type: string, minLength: 1, maxLength: 80 }
        exclusive: { type: boolean }

    SpeakerResponse:
      type: object
      required: [id, organization_id, display_name, bio, media_ref, public_consent, public_consent_at, public_consent_version, exclusive, archived_at, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        display_name: { type: string }
        bio: { type: [string, "null"] }
        media_ref: { type: [string, "null"] }
        public_consent: { type: boolean }
        public_consent_at: { type: [string, "null"], format: date-time }
        public_consent_version: { type: [string, "null"], maxLength: 80 }
        exclusive: { type: boolean }
        archived_at: { type: [string, "null"], format: date-time }
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SpeakerListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SpeakerResponse" }
        next_cursor:
          type: [string, "null"]

    ProgramWrite:
      type: object
      additionalProperties: false
      required: [slug, name, display_order]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 100
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 3000 }
        display_order: { type: integer, minimum: 0 }
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: >-
            A foreground or track marker color on a white agenda canvas. The service must reject
            values with WCAG contrast ratio below 4.5:1 against #FFFFFF. Clients must not be the
            only enforcement point.

    ProgramPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 100
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 3000 }
        display_order: { type: integer, minimum: 0 }
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Must have WCAG contrast ratio of at least 4.5:1 against #FFFFFF.

    ProgramResponse:
      type: object
      required: [id, organization_id, event_id, slug, name, description, display_order, color, archived_at, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        display_order: { type: integer, minimum: 0 }
        color: { type: [string, "null"] }
        archived_at: { type: [string, "null"], format: date-time }
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProgramListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProgramResponse" }
        next_cursor:
          type: [string, "null"]

    SessionWrite:
      type: object
      additionalProperties: false
      required: [program_id, title, starts_at, ends_at, venue_id]
      description: A new session starts in draft. The caller cannot set status. Draft sessions do not reserve exclusive resources until scheduled.
      properties:
        program_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 220 }
        description: { type: string, maxLength: 5000 }
        starts_at: { type: string, format: date-time, description: RFC 3339 instant normalized to UTC for storage. }
        ends_at: { type: string, format: date-time, description: RFC 3339 instant normalized to UTC for storage. }
        venue_id: { type: string, format: uuid }
        speaker_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
          description: >-
            Optional speaker profiles associated to this draft session. Every speaker must be active
            in the authenticated organization; exclusive speakers are reserved when the session is scheduled.

    SessionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        program_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 220 }
        description: { type: string, maxLength: 5000 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        venue_id: { type: string, format: uuid }
        speaker_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }

    SessionResponse:
      type: object
      required: [id, organization_id, event_id, program_id, title, description, starts_at, ends_at, timezone, venue_id, speaker_ids, status, status_reason, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        program_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        timezone:
          type: string
          description: "IANA timezone from the parent event, for presentation only."
        venue_id: { type: string, format: uuid }
        speaker_ids:
          type: array
          items: { type: string, format: uuid }
        status: { type: string, enum: [draft, scheduled, cancelled, completed] }
        status_reason: { type: [string, "null"] }
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SessionListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionResponse" }
        next_cursor:
          type: [string, "null"]

    ScheduleValidationRequest:
      type: object
      additionalProperties: false
      required: [expected_event_revision, candidate_sessions]
      properties:
        expected_event_revision:
          type: integer
          minimum: 1
          description: Event revision from the existing Configuration event resource; not a schedule revision.
        candidate_sessions:
          type: array
          maxItems: 500
          description: New candidate sessions to check together and against already scheduled sessions. This preview does not replace existing sessions.
          items: { $ref: "#/components/schemas/SessionWrite" }

    ScheduleConflict:
      type: object
      required: [resource_type, resource_id, starts_at, ends_at]
      properties:
        resource_type: { type: string, enum: [venue, speaker] }
        resource_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        session_id: { type: [string, "null"], format: uuid }
        candidate_index: { type: integer, minimum: 0, description: Index of the candidate session in the request when this conflict concerns a candidate. }
        conflicting_candidate_index: { type: integer, minimum: 0, description: Index of the other candidate when two proposed sessions conflict. }

    ScheduleValidationResponse:
      type: object
      required: [event_id, expected_event_revision, is_valid, conflicts, errors, warnings]
      properties:
        event_id: { type: string, format: uuid }
        expected_event_revision: { type: integer, minimum: 1 }
        is_valid: { type: boolean }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/ScheduleConflict" }
        errors:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }

    ScheduleConflictProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [conflicts]
          properties:
            conflicts:
              type: array
              items: { $ref: "#/components/schemas/ScheduleConflict" }

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - code
        - detail
        - request_id
        - errors
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            required: [pointer, code, message]
            properties:
              pointer:
                type: string
              code:
                type: string
              message:
                type: string

  responses:
    ProblemBadRequest:
      description: Bad Request (Invalid parameters / Schema mismatch)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProblemUnauthorized:
      description: Unauthorized (Token missing or invalid)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProblemForbidden:
      description: Forbidden (Scope insufficient or tenant mismatch)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProblemNotFound:
      description: Resource Not Found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProblemConflict:
      description: Conflict (Idempotency conflict or concurrent modification)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProblemPreconditionFailed:
      description: Precondition Failed (ETag / If-Match revision mismatch)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProblemUnprocessable:
      description: Unprocessable Content (Domain rule validation failed)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProblemPreconditionRequired:
      description: Precondition Required (If-Match header is required)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
