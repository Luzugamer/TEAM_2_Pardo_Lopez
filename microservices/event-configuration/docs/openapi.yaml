openapi: 3.1.0
info:
  title: Event Configuration API - Team 2
  description: API for event lifecycle, schedule/resources, forms, and publication contracts. Responses include X-Request-Id. BearerAuth is the integration contract; DevActor is local development only.
  version: 1.0.0
tags:
  - name: Schedule - EC-B
    description: Venue, program, and session operations owned by Integrante B.
servers:
  - url: /configuration/v1
    description: Base path for Configuration API v1

paths:
  /forms:
    get:
      operationId: listFormDefinitions
      x-required-scope: events:write
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      responses: { '200': { description: Lista de definiciones del tenant (máximo 100). } }
    post:
      operationId: createFormDefinition
      x-required-scope: events:write
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [name, purpose], properties: { name: { type: string, minLength: 1, maxLength: 180 }, purpose: { type: string, enum: [registration, application, feedback] } } }
      responses: { '201': { description: Definición creada. }, '400': { description: Entrada inválida. }, '409': { description: Clave idempotente reutilizada. } }
  /forms/{id}:
    get:
      operationId: getFormDefinition
      x-required-scope: events:write
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Definición. }, '404': { description: No existe en el tenant. } }
  /forms/{id}/versions:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: listFormVersions
      x-required-scope: events:write
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      responses: { '200': { description: Versiones de la definición. } }
    post:
      operationId: createFormVersion
      x-required-scope: events:write
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FormsDraftInput' } } } }
      responses: { '201': { description: Versión draft. }, '404': { description: Definición no encontrada. } }
  /form-versions/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getFormVersion
      x-required-scope: events:write
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      responses: { '200': { description: Versión. }, '404': { description: No encontrada. } }
    patch:
      operationId: updateFormVersionDraft
      x-required-scope: events:write
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FormsDraftInput' } } } }
      responses: { '200': { description: Draft actualizado. }, '409': { description: Versión no editable. }, '412': { description: Revisión obsoleta. } }
  /form-versions/{id}/validations:
    post:
      operationId: validateFormVersion
      x-required-scope: events:write
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '201': { description: Resultado de validación y expected_hash para publicación. } }
  /form-versions/{id}/publications:
    post:
      operationId: publishFormVersion
      x-required-scope: events:publish
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expected_hash], properties: { expected_hash: { type: string, minLength: 64, maxLength: 64 } } } } } }
      responses: { '201': { description: Versión publicada inmutable. }, '412': { description: Revisión o hash obsoleto. }, '422': { description: Draft inválido. } }
  /events/{id}/form-bindings:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: listEventFormBindings
      x-required-scope: events:write
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      responses: { '200': { description: Bindings del evento. } }
    post:
      operationId: createEventFormBinding
      x-required-scope: events:write
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [form_version_id, purpose, status, opens_at, closes_at]
              properties:
                form_version_id: { type: string, format: uuid }
                purpose: { type: string, enum: [registration, application, feedback] }
                status: { type: string, enum: [scheduled, open], description: No existe activación automática de scheduled. }
                opens_at: { type: string, format: date-time }
                closes_at: { type: string, format: date-time }
                replace_binding_id: { type: string, format: uuid }
                replace_revision: { type: integer, minimum: 1 }
                replace_reason: { type: string, minLength: 1, maxLength: 500 }
      responses: { '201': { description: Binding creado. }, '409': { description: Ya existe un binding abierto para el propósito. }, '422': { description: Versión no publicable o propósito incompatible. } }
  /bindings/{id}/openings:
    post:
      operationId: openScheduledFormBinding
      description: Propuesta local; transición manual de scheduled a open.
      x-required-scope: events:write
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses: { '200': { description: Binding abierto. }, '409': { description: Conflicto o transición inválida. }, '412': { description: Revisión obsoleta. } }
  /bindings/{id}/cancellations:
    post:
      operationId: cancelFormBinding
      description: Propuesta local; cancela un binding scheduled u open.
      x-required-scope: events:write
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses: { '200': { description: Binding cancelado. }, '409': { description: Transición inválida. }, '412': { description: Revisión obsoleta. } }
  /bindings/{id}/closures:
    post:
      operationId: closeFormBinding
      x-required-scope: events:write
      security: [{ BearerAuth: [] }, { DevActor: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses: { '200': { description: Binding cerrado. }, '409': { description: Transición inválida. }, '412': { description: Revisión obsoleta. } }
  /speakers/consent-notice:
    get:
      tags: [Schedule - EC-B]
      summary: Get the active speaker public-profile consent notice
      description: Returns the server-configured notice and opaque version required when accepting public-profile publication.
      operationId: ecBApi024GetSpeakerConsentNotice
      x-requirement-id: EC-B-API-024
      x-required-scope: events:write
      security:
        - BearerAuth: []
        - DevActor: []
      responses:
        "200":
          description: Current notice configuration.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, text]
                properties:
                  version: { type: string, minLength: 1, maxLength: 80 }
                  text: { type: string, minLength: 1, maxLength: 10000 }
        "401": { $ref: "#/components/responses/ProblemUnauthorized" }
        "403": { $ref: "#/components/responses/ProblemForbidden" }

  /events:
    post:
      summary: Create a new event draft
      operationId: createEvent
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Unique command idempotency token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
      responses:
        "201":
          description: Event successfully created in draft state.
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag representing current revision number (e.g. "1").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "409":
          $ref: "#/components/responses/ProblemConflict"
        "422":
          $ref: "#/components/responses/ProblemUnprocessable"

    get:
      summary: List events for the authenticated tenant with cursor pagination
      operationId: listEvents
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: query
          name: site_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: kind
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [draft, published, closed, cancelled, archived]
        - in: query
          name: from_date
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: to_date
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: Opaque cursor for deterministic pagination.
      responses:
        "200":
          description: List of events matching filters within tenant isolation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"

  /events/{id}:
    get:
      summary: Get event details by ID
      operationId: getEventById
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event found.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "404":
          $ref: "#/components/responses/ProblemNotFound"

    patch:
      summary: Edit event metadata and rules with optimistic concurrency control
      operationId: updateEvent
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
          description: Current revision ETag (e.g. "1") required for optimistic concurrency control.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Event successfully updated with incremented revision number.
          headers:
            ETag:
              schema:
                type: string
              description: New revision number ETag (e.g. "2").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
        "409":
          $ref: "#/components/responses/ProblemConflict"
        "412":
          $ref: "#/components/responses/ProblemPreconditionFailed"
        "422":
          $ref: "#/components/responses/ProblemUnprocessable"
        "428":
          $ref: "#/components/responses/ProblemPreconditionRequired"

  /events/{id}/duplications:
    post:
      summary: Duplicate event configuration into a new draft
      operationId: duplicateEvent
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Identifier of the source event to duplicate.
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Unique command idempotency token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventDuplicate"
      responses:
        "201":
          description: Event successfully duplicated into a new draft (revision 1).
          headers:
            ETag:
              schema:
                type: string
              description: Initial revision ETag ("1").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
        "409":
          $ref: "#/components/responses/ProblemConflict"
        "422":
          $ref: "#/components/responses/ProblemUnprocessable"

  /events/{id}/closures:
    post:
      summary: Close registrations for a published event
      operationId: closeEvent
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
          description: Expected revision number ETag.
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Unique command idempotency token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, effective_at]
              properties:
                reason:
                  type: string
                  maxLength: 500
                effective_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Event registrations successfully closed.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
        "409":
          $ref: "#/components/responses/ProblemConflict"
        "412":
          $ref: "#/components/responses/ProblemPreconditionFailed"
        "422":
          $ref: "#/components/responses/ProblemUnprocessable"
        "428":
          $ref: "#/components/responses/ProblemPreconditionRequired"

  /events/{id}/cancellations:
    post:
      summary: Cancel an event with reason and emit domain cancellation event
      operationId: cancelEvent
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
          description: Expected revision number ETag.
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Unique command idempotency token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
                - effective_at
              properties:
                reason:
                  type: string
                  maxLength: 500
                  example: "Sede inaccesible por fuerza mayor."
                effective_at:
                  type: string
                  format: date-time
                  example: "2026-11-20T14:00:00Z"
      responses:
        "200":
          description: Event successfully cancelled and domain cancellation queued in outbox.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
        "409":
          $ref: "#/components/responses/ProblemConflict"
        "412":
          $ref: "#/components/responses/ProblemPreconditionFailed"
        "422":
          $ref: "#/components/responses/ProblemUnprocessable"
        "428":
          $ref: "#/components/responses/ProblemPreconditionRequired"

  /events/{id}/archives:
    post:
      summary: Archive a terminal event (closed or cancelled)
      description: Requires events:write. The event must already be closed or cancelled.
      operationId: archiveEvent
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
          description: Expected revision number ETag.
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Unique command idempotency token.
      responses:
        "200":
          description: Event successfully archived.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
        "409":
          $ref: "#/components/responses/ProblemConflict"
        "412":
          $ref: "#/components/responses/ProblemPreconditionFailed"
        "422":
          $ref: "#/components/responses/ProblemUnprocessable"
        "428":
          $ref: "#/components/responses/ProblemPreconditionRequired"

  /events/{id}/assignments:
    get:
      summary: List all role assignments for an event
      operationId: listEventAssignments
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of assignments for this event.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignmentResponse"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"

    post:
      summary: Assign a responsible user to an event with role and scopes (EC-006)
      operationId: createEventAssignment
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Unique command idempotency token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentCreate"
      responses:
        "201":
          description: Assignment successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
        "409":
          $ref: "#/components/responses/ProblemConflict"
        "422":
          $ref: "#/components/responses/ProblemUnprocessable"

  /events/{id}/assignments/{assignment_id}:
    delete:
      summary: Revoke an event role assignment (EC-006)
      operationId: revokeEventAssignment
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: assignment_id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Unique command idempotency token.
      responses:
        "200":
          description: Assignment successfully revoked (is_active set to false).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
        "409":
          $ref: "#/components/responses/ProblemConflict"

  /events/{id}/publication-validations:
    post:
      summary: Check publication readiness across domain artifacts (EC-030)
      operationId: validateEventPublication
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationValidationCreate"
      responses:
        "200":
          description: Readiness report detailing blocking errors and non-blocking warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"

  /events/{id}/releases:
    get:
      summary: List all publication releases for an event
      operationId: listEventReleases
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of immutable publication releases.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReleaseResponse"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"

    post:
      summary: Assemble and publish an atomic release manifest (EC-031)
      operationId: createEventRelease
      security:
        - BearerAuth: []
        - DevActor: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
          description: Expected current revision number ETag.
